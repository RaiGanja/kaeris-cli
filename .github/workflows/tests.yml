# CI for the `kaeris` package on PyPI.
#
# This package has zero runtime dependencies and promises Python 3.8+ on PyPI — a promise it
# has already broken once, with a possessive regex quantifier that only parses on 3.11+. That
# was found by a user's runtime, not by us. So the oldest promised version is a first-class
# job here, not an afterthought.
#
# The second thing this checks is the artefact itself. Unit tests pass against the source tree;
# what users install is a wheel, and a wheel can be missing a module while every test still
# goes green. So CI builds it, installs it into a clean venv, and runs the console script.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 and 3.9 are gone from ubuntu-24.04 images, so the oldest promised versions run
          # on 22.04. 3.14 is what the production backend runs.
          - {python: '3.8',  os: ubuntu-22.04}
          - {python: '3.9',  os: ubuntu-22.04}
          - {python: '3.12', os: ubuntu-latest}
          - {python: '3.14', os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install pytest

      - name: Test suite
        run: python -m pytest -q -rs | tee pytest.txt

      - name: No test may be silently skipped
        run: |
          # A skip normally means a dependency is missing and tests that exist are not running.
          # Two skips are structurally unavoidable in THIS checkout, and only these two:
          #
          #   test_detector_parity      — compares this package's copy of the detectors against
          #                               backend/translator.py, which lives in a different
          #                               (private) repository. Not dropped: the backend's own
          #                               CI clones this repo and runs the comparison there.
          #   test_encoding_parity       — same story as detector parity: сравнивает наши правила
          #                               кодировок с backend/encoding-правилами из другого
          #                               репозитория. Бэкендовский CI гоняет то же сравнение
          #                               у себя, поэтому здесь пропуск структурный, а не потеря.
          #   test_check_xcstrings       — the parity half of it compares this package's catalog
          #                               parser against the backend's, which lives in the
          #                               private repo. Runs in the backend's CI, same as the
          #                               detector parity above.
          #   test_dist_matches_the_tree — guards `twine upload dist/*` against publishing a
          #                               stale wheel. It has meaning only where a wheel has
          #                               been built, i.e. on the machine doing the release.
          #                               CI has no dist/ and must not build one.
          #
          # That second one is why this job sat red from 03.08 to 04.08: the test was added
          # with the guard still demanding exactly one skip, so every push failed and the
          # failure emails became indistinguishable from noise. Anything NOT on this list
          # still fails the build — that is the whole point of the check.
          if grep -qE '[0-9]+ skipped' pytest.txt; then
            unexpected=$(grep -E '^SKIPPED' pytest.txt \
              | grep -vE 'test_detector_parity|test_dist_matches_the_tree|test_check_xcstrings|test_encoding_parity' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::unexpected skip — a dependency is missing and real tests are not running"
              echo "$unexpected"
              exit 1
            fi
            grep -q 'test_detector_parity' pytest.txt || {
              echo "::error::the detector-parity skip is gone — did the test stop existing?"; exit 1; }
            echo "Only the two structurally impossible skips — ok"
          fi

  # What people actually install
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Metadata must be valid for PyPI
        run: twine check dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/kaeris --version
          /tmp/clean/bin/kaeris check --help > /dev/null
          # A wheel that installs but ships a broken module would still pass the lines above,
          # so make the installed tool do its actual job: find a missing key. It exits non-zero
          # when it finds one — that IS the pass condition here, and an empty or silent run is
          # the failure we are looking for.
          mkdir -p /tmp/loc
          printf '{"greeting": "Hello", "save": "Save"}' > /tmp/loc/en.json
          printf '{"greeting": "Hallo"}' > /tmp/loc/de.json
          out=$(/tmp/clean/bin/kaeris check --source /tmp/loc/en.json --langs de 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "save" || {
            echo "::error::the installed wheel did not report the missing key"; exit 1; }

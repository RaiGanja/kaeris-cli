[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaeris"
version = "0.2.10"
description = "AI localization CLI — translate JSON/YAML/.strings/.po/ARB/Android XML into 46 languages"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "KAERIS" }]
keywords = ["i18n", "l10n", "localization", "translation", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    # Spelled out, and each one actually exercised: the suite runs green on 3.8 and 3.9 in
    # clean containers. Without these PyPI shows no version support at all, and a reader
    # can't tell whether an old runner is safe.
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Internationalization",
    "Environment :: Console",
]
# Zero runtime dependencies — stdlib only.
dependencies = []

[project.urls]
Homepage = "https://kaeris.dev"
Documentation = "https://kaeris.dev/developer.html"
Repository = "https://github.com/RaiGanja/kaeris-cli"

[project.scripts]
kaeris = "kaeris.cli:main"

[tool.setuptools]
packages = ["kaeris"]
